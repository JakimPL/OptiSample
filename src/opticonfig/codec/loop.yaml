# Loop-point detection (optisample.config.codec.LoopConfig).
min_hz: 40.0             # lowest fundamental searched for a loop period
max_hz: 2000.0           # highest fundamental searched
min_correlation: 0.3     # autocorrelation-peak floor below which material is "not periodic enough"
min_periods: 3           # a loop shorter than this beats/buzzes audibly
min_loop_s: 0.5          # floor on loop length in seconds (spans several vibrato cycles)
placements: 3            # loop starts spread through the steady region
length_multiples: [1, 2] # loop lengths offered at each start, as multiples of the floor
attack_skip_s: 0.05      # onset skipped before period estimation / loop placement
tail_skip_s: 0.02        # tail skipped at the end of the steady region
max_estimation_s: 1.0    # cap on the autocorrelation window
sustain_decay_ratio: 0.5 # late/early RMS below this = decaying (declines to loop)
crossfade_s: 0.01        # loop-seam crossfade length in seconds
