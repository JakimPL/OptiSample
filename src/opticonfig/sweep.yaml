# Encoding sweep grid (optisample.config.optimize.SweepConfig).
rates: [8000, 11025, 16000, 22050, 28800, 37800, 44100] # reduced rates; a clip is also offered its own
depths: [16, 8]              # swept bit depths
dither: true
noise_shaping: false
loops: [true]                # loop by default; non-periodic material falls back to a trim
compress: [false, true]      # swept where the quantizer is shallow enough to hear the headroom it buys
