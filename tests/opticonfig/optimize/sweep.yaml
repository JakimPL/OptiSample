# What a clip may be stored as (optisample.config.optimize.SweepConfig).
rates: [8000, 11025, 16000, 22050, 28800, 32000, 37800, 44100] # ladder a rate is chosen from; a clip's own rate joins it
rate_headroom: 0             # rungs above the settled one each span is also offered at
depths: [16, 8]              # grids a stored sample is offered at; a shallow copy costs half the frames
dither: false
noise_shaping: false
compress: true               # offered beside the plain encoding where the depth is shallow enough to hear it
carriers: [true, false]      # storages a span is offered as; both cost the same bytes, so fidelity decides
min_carried_attack_ticks: 0.0 # the fixtures' notes rise in a few ms; the gate's own tests name their own
