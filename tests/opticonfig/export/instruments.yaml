# How a set of recordings is written as standalone instruments (optisample.config.export.InstrumentsConfig).
post_loop: true # keep what a recording goes on making past the loop it wraps on, stored behind the region
compression: # what the shared curve had no room to state, held back before any waveform is stored
  threshold_db: 6.0 # the hold opens this far over the body of the flattened level, leaving a flat one alone
  ratio: 8.0 # a level past the threshold keeps an eighth of its excess; 1.0 stores the waveform as it stands
  knee_db: 6.0 # width of the bend the ratio arrives over
  attack_share: 0.0 # the hold opens exactly where the curve asks for it, which is the reduction on its own
  release_share: 0.0 # and closes there too, so a fixture reads the curve rather than the hold around it
  ceiling_db: 96.0 # past any level a recording reaches over its own body, so the ratio alone shapes it
