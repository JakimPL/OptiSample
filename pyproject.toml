[project]
name = "optisample"
version = "0.0.2"
description = "OptiSample - Sample optimizer utility for creating ImpulseTracker instruments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jakim" }]
dependencies = [
    "msgpack>=1.1.2",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "tqdm>=4.67.1",
    "trackmod",
]

[project.scripts]
optisample = "optisample.__main__:main"

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "marimo>=0.23.14",
    "matplotlib>=3.11.1",
    "mypy==2.1.0",
    "plotly>=6.9.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "scikit-learn>=1.9.0",
    "types-PyYAML==6.0.12.20260518",
    "umap-learn>=0.5.12",
    "xmodits-py>=0.3.5",
]

[tool.uv.sources]
trackmod = { path = "trackmod", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optisample", "src/opticonfig"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["optisample"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov -p tests.threads"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/optisample"]

[tool.coverage.report]
show_missing = true
fail_under = 99

[tool.mypy]
files = ["src/optisample", "notebooks/utils"]
exclude = ["tests", 'notebooks/[^/]+\.py$']
plugins = ["pydantic.mypy"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
python_version = "3.13"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
ignore-paths = ['(.*/)?notebooks/[^/]+\.py$']
ignored-modules = ["xmodits"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-public-methods",
]
